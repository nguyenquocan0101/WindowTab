name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Build and package Windows x64
        shell: pwsh
        run: ./tools/Package-Release.ps1 -OutputDirectory "$env:RUNNER_TEMP/windowtab-release"
      - name: Upload package and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: WindowTab-win-x64
          path: |
            ${{ runner.temp }}/windowtab-release/WindowTab-win-x64.zip
            ${{ runner.temp }}/windowtab-release/SHA256SUMS.txt
          if-no-files-found: error
