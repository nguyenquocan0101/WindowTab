    <path d="M444 145h210M674 145h122"/>
    <rect x="898" y="100" width="284" height="184" rx="16" fill="url(#pane)"/>
    <path d="M898 134h284"/>
  </g>
  <g fill="#3063dd"><circle cx="102" cy="130" r="4"/><circle cx="462" cy="130" r="4"/><circle cx="692" cy="130" r="4"/><circle cx="918" cy="117" r="4"/></g>
