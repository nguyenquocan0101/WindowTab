  <g fill="#5b6b82" font-family="Segoe UI, sans-serif" font-size="16"><text x="92" y="320">Make room for the next window.</text><text x="502" y="320">Move in order. Keep your bearings.</text><text x="928" y="320">Back to the work that matters.</text></g>
