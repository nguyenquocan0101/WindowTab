<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="352" viewBox="0 0 1280 352" role="img" aria-labelledby="title desc">
  <title id="title">WindowTab: Shrink, slide, zoom</title>
  <desc id="desc">An illustration of the three-stage window transition, not a screenshot.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#edf3ff"/><stop offset="1" stop-color="#f7f9fd"/></linearGradient>
    <linearGradient id="pane" x2="1" y2="1"><stop stop-color="#fafdff"/><stop offset="1" stop-color="#dbe7ff"/></linearGradient>
  </defs>
  <rect width="1280" height="352" rx="24" fill="url(#bg)"/>
  <g fill="#1c273b" font-family="Segoe UI, sans-serif" font-size="24" font-weight="600">
    <text x="92" y="68">Shrink</text><text x="502" y="68">Slide</text><text x="928" y="68">Zoom</text>
  </g>
